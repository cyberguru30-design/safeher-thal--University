  <body class="bg-[#FAF9FC] text-[#25212B] antialiased selection:bg-[#7651A8] selection:text-white font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(() => console.log('SW registered - Offline Ready'))
            .catch((e) => console.log(e));
        });
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        if (typeof window.showInstallButton === 'function') {
          window.showInstallButton();
        }
      });
    </script>
  </body>
